<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Requisição de Compras – Fazenda Amori</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <header class="header">
        <h1>Fazenda Amori</h1>
        <p>Requisição de Compras</p>
    </header>

    <main class="container">
        <form id="purchase-form">

            <section class="card">
                <h2>Dados da Requisição</h2>
                <div class="grid">
                    <div class="field">
                        <label>Nº Requisição</label>
                        <input id="numeroRequisicao" type="text" />
                    </div>
                    <div class="field">
                        <label>Solicitante</label>
                        <input id="solicitante" type="text" />
                    </div>
                    <div class="field">
                        <label>Área</label>
                        <input id="area" type="text" />
                    </div>
                    <div class="field">
                        <label>Data</label>
                        <input id="data" type="date" />
                    </div>
                    <div class="field">
                        <label>Dentro do Orçado?</label>
                        <select id="orcado">
                            <option value="true">Sim</option>
                            <option value="false">Não</option>
                        </select>
                    </div>
                    <div class="field">
                        <label>Prazo de Recebimento</label>
                        <input id="prazo" type="date" />
                    </div>
                </div>
            </section>

            <section class="card">
                <h2>Itens</h2>
                <div id="items-container"></div>
                <button type="button" id="add-item-btn" class="btn secondary small">
                    + Adicionar Item
                </button>
            </section>

            <section class="card">
                <h2>Fornecedores</h2>
                <div class="grid">
                    <div class="field">
                        <label>Fornecedor 1</label>
                        <input id="fornecedor1" type="text" />
                    </div>
                    <div class="field">
                        <label>Fornecedor 2</label>
                        <input id="fornecedor2" type="text" />
                    </div>
                    <div class="field">
                        <label>Fornecedor 3</label>
                        <input id="fornecedor3" type="text" />
                    </div>
                </div>
            </section>

            <button id="submit" class="btn primary" type="button">Gerar Excel</button>

        </form>
    </main>

    <script src="app.js"></script>
</body>
</html>
